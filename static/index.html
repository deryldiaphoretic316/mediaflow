<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .log-entry { font-family: 'SF Mono', 'Menlo', monospace; font-size: 0.75rem; }
    body.theme-light { background: #f3f4f6 !important; color: #111827 !important; }
    body.theme-light .bg-gray-950 { background-color: #f3f4f6 !important; }
    body.theme-light .bg-gray-900 { background-color: #ffffff !important; }
    body.theme-light .bg-gray-800 { background-color: #f9fafb !important; }
    body.theme-light .bg-gray-700 { background-color: #e5e7eb !important; }
    body.theme-light .border-gray-800,
    body.theme-light .border-gray-700,
    body.theme-light .border-gray-600 { border-color: #d1d5db !important; }
    body.theme-light .text-gray-100,
    body.theme-light .text-gray-300,
    body.theme-light .text-gray-400 { color: #374151 !important; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="app()" x-init="init()" x-cloak>

  <div class="max-w-3xl mx-auto px-4 py-10" @change="onSettingsChange">

    <!-- Header -->
    <div class="mb-8 flex items-center gap-3">
      <svg class="w-8 h-8 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z"/>
      </svg>
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">MediaFlow</h1>
        <p class="text-xs text-gray-500 mt-0.5" x-text="t('app.byline')"></p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="mb-6 flex w-full justify-between gap-2">
      <button @click="activeTab = 'copy'"
        :class="activeTab === 'copy' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
        class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors">
        <span x-text="t('tab.copy')"></span>
      </button>
      <button @click="activeTab = 'sort'"
        :class="activeTab === 'sort' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
        class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors">
        <span x-text="t('tab.sort')"></span>
      </button>
      <button @click="activeTab = 'dedup'"
        :class="activeTab === 'dedup' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
        class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors">
        <span x-text="t('tab.dedup')"></span>
      </button>
      <button @click="activeTab = 'meta'"
        :class="activeTab === 'meta' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
        class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors">
        <span x-text="t('tab.meta')"></span>
      </button>
      <button @click="activeTab = 'prefs'"
        :class="activeTab === 'prefs' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
        class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors">
        <span x-text="t('tab.prefs')"></span>
      </button>
    </div>

    <!-- Settings card -->
    <div x-show="activeTab === 'copy'" class="bg-gray-900 rounded-2xl p-6 mb-6 space-y-5">
      <h2 class="text-sm font-medium text-gray-400 uppercase tracking-wider" x-text="t('copy.settingsTitle')"></h2>

      <!-- 1. Source -->
      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`1. ${t('workflow.pickSource')}`"></p>
        <label class="block text-sm mb-1 text-gray-300" x-text="t('field.sourceCopy')"></label>
        <div class="flex gap-2 items-center">
          <input type="text" x-model="settings.source_path" @change="refreshAvailableExtensions()"
            placeholder="/Volumes/SD_CARD/DCIM"
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
          <button type="button" @click="refreshAvailableExtensions()" :title="t('common.refresh')"
            class="flex-shrink-0 inline-flex items-center justify-center w-9 h-9 rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
          <button @click="openBrowser('source')" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">
            <span x-text="t('common.browse')"></span>
          </button>
        </div>
        <div class="mt-2 text-xs text-gray-500">
          <span x-text="`${t('workflow.totalFiles')}: ${copySourceSummary.total_files}`"></span>
          <span class="mx-2">•</span>
          <span x-text="`${t('workflow.inScope')}: ${copySourceSummary.matched_files}`"></span>
          <span class="mx-2">•</span>
          <span x-text="modeText()"></span>
          <p x-show="copySourceSummary.exists && copySourceSummary.total_files === 0" class="mt-1" x-text="t('workflow.noFilesInFolder')"></p>
        </div>
      </div>

      <!-- 2. File types -->
      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`2. ${t('workflow.reviewFolder')}`"></p>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm text-gray-300" x-text="t('copy.fileTypes')"></label>
          <div class="flex gap-2">
            <button @click="selectAllExtensions()" type="button" class="px-2 py-1 text-xs bg-gray-800 hover:bg-gray-700 rounded transition-colors">
              <span x-text="t('common.selectAll')"></span>
            </button>
            <button @click="clearExtensions()" type="button" class="px-2 py-1 text-xs bg-gray-800 hover:bg-gray-700 rounded transition-colors">
              <span x-text="t('common.clear')"></span>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
          <template x-for="ext in availableExtensions" :key="ext">
            <label class="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 cursor-pointer hover:border-gray-600 transition-colors">
              <input type="checkbox" class="accent-blue-500" :value="ext"
                :checked="settings.selected_extensions.includes(ext)" @change="toggleExtension(ext)" />
              <span class="text-xs uppercase" x-text="ext.slice(1)"></span>
            </label>
          </template>
        </div>
        <p x-show="availableExtensions.length === 0" class="text-xs text-gray-500 mt-2" x-text="t('common.noSupportedFiles')"></p>
        <p class="text-xs text-gray-500 mt-2">
          <span x-text="t('common.selected')"></span>:
          <span x-text="settings.selected_extensions.length"></span>
          <span x-text="t('common.of')"></span>
          <span x-text="availableExtensions.length"></span>
        </p>
      </div>

      <!-- 3. Configure -->
      <div class="p-3 space-y-5">
        <p class="text-xs text-blue-400 mb-2" x-text="`3. ${t('workflow.configure')}`"></p>
        <div>
          <label class="block text-sm mb-2 text-gray-300" x-text="t('copy.folderStructure')"></label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.folder_structure" value="camera/year/month" class="accent-blue-500" />
              <span class="text-sm" x-text="t('layout.cameraYearMonth')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.folder_structure" value="year/month" class="accent-blue-500" />
              <span class="text-sm" x-text="t('layout.yearMonth')"></span>
            </label>
          </div>
          <p class="text-xs text-gray-500 mt-1">
            <span x-text="t('common.example')"></span>:
            <span x-text="settings.folder_structure === 'camera/year/month'
              ? 'Canon EOS R5 / 2024 / 03 / IMG_1234.jpg'
              : '2024 / 03 / IMG_1234.jpg'"></span>
          </p>
        </div>
        <div>
          <label class="block text-sm mb-2 text-gray-300" x-text="t('copy.duplicates')"></label>
          <div class="flex gap-4 flex-wrap">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.duplicate_handling" value="skip" class="accent-blue-500" />
              <span class="text-sm" x-text="t('copy.dupSkip')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.duplicate_handling" value="rename" class="accent-blue-500" />
              <span class="text-sm" x-text="t('copy.dupRename')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.duplicate_handling" value="overwrite" class="accent-blue-500" />
              <span class="text-sm" x-text="t('copy.dupOverwrite')"></span>
            </label>
          </div>
        </div>
        <div>
          <label class="block text-sm mb-2 text-gray-300" x-text="t('copy.operation')"></label>
          <div class="flex gap-4 flex-wrap">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.operation_mode" value="copy" class="accent-blue-500" />
              <span class="text-sm" x-text="t('common.copy')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.operation_mode" value="move" class="accent-blue-500" />
              <span class="text-sm" x-text="t('common.move')"></span>
            </label>
          </div>
          <p class="text-xs text-gray-500 mt-1">
            <span x-show="settings.operation_mode === 'copy'" x-text="t('copy.modeCopyHint')"></span>
            <span x-show="settings.operation_mode === 'move'" x-text="t('copy.modeMoveHint')"></span>
          </p>
        </div>
      </div>

      <!-- 4. Destination -->
      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`4. ${t('workflow.pickDestination')}`"></p>
        <label class="block text-sm mb-2 text-gray-300" x-text="t('field.destination')"></label>
        <div class="flex gap-2">
          <input type="text" x-model="settings.destination_path" placeholder="/Volumes/Photos"
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
          <button @click="openBrowser('destination')"
            class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">
            <span x-text="t('common.browse')"></span>
          </button>
        </div>
      </div>

      <div class="flex justify-end p-3">
        <button @click="saveSettings()"
          :disabled="saving || !hasChanges"
          :class="hasChanges ? 'bg-blue-600 hover:bg-blue-500' : 'bg-gray-700'"
          class="px-5 py-2 disabled:opacity-50 rounded-lg text-sm font-medium text-white transition-colors">
          <span x-text="saving ? t('common.saving') : hasChanges ? t('common.saveSettings') : t('common.saved')"></span>
        </button>
      </div>
    </div>

    <!-- Copy run card -->
    <div x-show="activeTab === 'copy'" class="bg-gray-900 rounded-2xl p-6 mb-6 space-y-5">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-medium text-gray-400 uppercase tracking-wider" x-text="t('tab.copy')"></h2>
        <div x-show="running" class="flex items-center gap-2">
          <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
          <span class="text-xs text-green-400" x-text="t('common.running')"></span>
        </div>
      </div>

      <div x-show="total > 0" class="px-3">
        <div class="flex justify-between text-xs text-gray-400 mb-1">
          <span x-text="`${settings.operation_mode === 'move' ? t('copy.progressMove') : t('copy.progressCopy')}: ${current} / ${total} ${t('common.files')}`"></span>
          <span x-text="`${Math.round(current / total * 100)}%`"></span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2">
          <div class="bg-blue-500 h-2 rounded-full transition-all duration-300"
            :style="`width: ${total > 0 ? (current / total * 100) : 0}%`"></div>
        </div>
        <div class="flex gap-4 mt-2 text-xs text-gray-400">
          <span class="text-green-400"
            x-text="`✓ ${settings.operation_mode === 'move' ? t('copy.moved') : t('copy.copied')}: ${copied}`"></span>
          <span class="text-yellow-400" x-text="`⊘ ${t('copy.skipped')}: ${skipped}`"></span>
          <span x-show="errors > 0" class="text-red-400" x-text="`✗ ${t('common.errors')}: ${errors}`"></span>
        </div>
      </div>

      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`5. ${t('workflow.runAction')}`"></p>
        <button @click="running ? stopCopy() : startCopy()"
          :disabled="!running && (!settings.source_path || !settings.destination_path)"
          :class="running ? 'bg-red-600 hover:bg-red-500' : 'bg-blue-600 hover:bg-blue-500 disabled:opacity-40'"
          class="w-full py-3 rounded-xl font-medium text-white transition-colors disabled:cursor-not-allowed">
          <span x-text="running ? t('common.stop') : t('copy.start')"></span>
        </button>
      </div>

      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`6. ${t('workflow.monitor')}`"></p>
        <div x-show="log.length > 0" class="bg-gray-950 rounded-xl p-3 max-h-64 overflow-y-auto" id="log-container">
          <template x-for="(entry, i) in log" :key="i">
            <div class="log-entry py-0.5"
              :class="{
                'text-green-400': entry.type === 'copied',
                'text-yellow-500': entry.type === 'skipped',
                'text-red-400': entry.type === 'error',
                'text-gray-400': entry.type === 'info',
                'text-blue-400': entry.type === 'done',
              }"
              x-text="entry.msg"></div>
          </template>
        </div>
      </div>
    </div>

    <!-- Sort settings card -->
    <div x-show="activeTab === 'sort'" class="bg-gray-900 rounded-2xl p-6 mb-6 space-y-5">
      <h2 class="text-sm font-medium text-gray-400 uppercase tracking-wider" x-text="t('sort.settingsTitle')"></h2>

      <!-- 1. Source -->
      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`1. ${t('workflow.pickSource')}`"></p>
        <label class="block text-sm mb-1 text-gray-300" x-text="t('field.source')"></label>
        <div class="flex gap-2 items-center">
          <input type="text" x-model="settings.sort.source_path" @change="refreshSortExtensions()"
            placeholder="/Volumes/SD_CARD/DCIM"
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
          <button type="button" @click="refreshSortExtensions()" :title="t('common.refresh')"
            class="flex-shrink-0 inline-flex items-center justify-center w-9 h-9 rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
          <button @click="openBrowser('sort_source')" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">
            <span x-text="t('common.browse')"></span>
          </button>
        </div>
        <div class="mt-2 text-xs text-gray-500">
          <span x-text="`${t('workflow.totalFiles')}: ${sortSourceSummary.total_files}`"></span>
          <span class="mx-2">•</span>
          <span x-text="`${t('workflow.inScope')}: ${sortSourceSummary.matched_files}`"></span>
          <span class="mx-2">•</span>
          <span x-text="modeText()"></span>
          <p x-show="sortSourceSummary.exists && sortSourceSummary.total_files === 0" class="mt-1" x-text="t('workflow.noFilesInFolder')"></p>
        </div>
      </div>

      <!-- 2. File types -->
      <div class="p-3">
        <p class="text-xs text-blue-400 mb-2" x-text="`2. ${t('workflow.reviewFolder')}`"></p>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm text-gray-300" x-text="t('sort.fileTypes')"></label>
          <div class="flex gap-2">
            <button @click="selectAllSortExtensions()" type="button" class="px-2 py-1 text-xs bg-gray-800 hover:bg-gray-700 rounded transition-colors">
              <span x-text="t('common.selectAll')"></span>
            </button>
            <button @click="clearSortExtensions()" type="button" class="px-2 py-1 text-xs bg-gray-800 hover:bg-gray-700 rounded transition-colors">
              <span x-text="t('common.clear')"></span>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
          <template x-for="ext in sortAvailableExtensions" :key="`sort-${ext}`">
            <label class="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 cursor-pointer hover:border-gray-600 transition-colors">
              <input type="checkbox" class="accent-blue-500" :checked="settings.sort.selected_extensions.includes(ext)" @change="toggleSortExtension(ext)" />
              <span class="text-xs uppercase" x-text="ext.slice(1)"></span>
            </label>
          </template>
        </div>
        <p x-show="sortAvailableExtensions.length === 0" class="text-xs text-gray-500 mt-2" x-text="t('common.noSupportedFiles')"></p>
        <p class="text-xs text-gray-500 mt-2">
          <span x-text="t('common.selected')"></span>:
          <span x-text="settings.sort.selected_extensions.length"></span>
          <span x-text="t('common.of')"></span>
          <span x-text="sortAvailableExtensions.length"></span>
        </p>
      </div>

      <!-- 3. Configure — same order as Copy: structure → naming options → operation -->
      <div class="p-3 space-y-5">
        <p class="text-xs text-blue-400 mb-2" x-text="`3. ${t('workflow.configure')}`"></p>

        <div>
          <label class="block text-sm mb-2 text-gray-300" x-text="t('sort.layout')"></label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.sort.folder_structure" value="camera/year/month" class="accent-blue-500" />
              <span class="text-sm" x-text="t('layout.cameraYearMonth')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" x-model="settings.sort.folder_structure" value="year/month" class="accent-blue-500" />
              <span class="text-sm" x-text="t('layout.yearMonth')"></span>
            </label>
          </div>
          <p class="text-xs text-gray-500 mt-1">
            <span x-text="t('common.example')"></span>:
            <span x-text="settings.sort.folder_structure === 'camera/year/month'
              ? 'Canon EOS R5 / 2024 / 03 / IMG_1234.jpg'
              : '2024 / 03 / IMG_1234.jpg'"></span>
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm mb-2 text-gray-300" x-text="t('sort.rename')"></label>
            <div class="space-y-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" x-model="settings.sort.rename_mode" value="original" class="accent-blue-500" />
                <span class="text-sm" x-text="t('sort.renameOriginal')"></span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" x-model="settings.sort.rename_mode" value="lowercase" class="accent-blue-500" />
                <span class="text-sm" x-text="t('sort.renameLower')"></span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" x-model="settings.sort.rename_mode" value="original_plus_number" class="accent-blue-500" />
                <span class="text-sm" x-text="t('sort.renamePlusNumber')"></span>
              </label>
            </div>
          </div>
          <div>
            <label class="block text-sm mb-2 text-gray-300" x-text="t('sort.jpegReplace')"></label>
            <div class="space-y-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" x-model="settings.sort.jpeg_to_jpg" class="accent-blue-500" />
                <span class="text-sm" x-text="t('sort.extJpegJpg')"></span>
              </label>
              <p class="text-xs text-gray-500" x-text="t('sort.jpegReplaceHint')"></p>
            </div>
          </div>
          <div>
            <label class="block text-sm mb-2 text-gray-300" x-text="t('sort.extension')"></label>
            <div class="space-y-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" x-model="settings.sort.extension_mode" value="lowercase" class="accent-blue-500" />
                <span class="text-sm" x-text="t('sort.extLower')"></span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" x-model="settings.sort.extension_mode" value="uppercase" class="accent-blue-500" />
                <span class="text-sm" x-text="t('sort.extUpper')"></span>
              </label>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm mb-2 text-gray-300" x-text="t('sort.mode')"></label>
          <div class="flex gap-4 flex-wrap">
            <label class="flex items-center gap-2 cursor-pointer">

      <div class="flex items-center justify-between p-4 border-b border-gray-800">
        <h3 class="font-medium" x-text="browser.pick === 'file' ? t('browser.titleFile') : t('browser.title')"></h3>

      <div class="p-3 border-b border-gray-800">
        <div class="flex items-center gap-2">
          <button @click="browseTo(browser.parent)" :disabled="!browser.parent"
            class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 disabled:opacity-30 rounded-lg text-sm" x-text="`← ${t('browser.back')}`"></button>
          <span class="text-sm text-gray-400 truncate" x-text="browser.current || t('browser.root')"></span>
        </div>
      </div>

        <template x-for="entry in browser.entries" :key="entry.path">
          <button @click="browseEntry(entry)"
            class="w-full text-left px-3 py-2 hover:bg-gray-800 rounded-lg text-sm flex items-center gap-2 transition-colors"
            :class="browser.pick === 'file' && entry.type === 'file' && browser.selectedFile === entry.path ? 'ring-1 ring-blue-500 bg-gray-800' : ''">
            <svg x-show="entry.type !== 'file'" class="w-4 h-4 text-yellow-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">

            <span x-text="entry.name"></span>
          </button>
        </template>

      </div>

        t(key) {
          const lang = this.settings?.preferences?.language || 'ru';
          return this.i18n[lang]?.[key] || this.i18n.ru[key] || key;
        },

        modeText() {
          return this.settings.preferences?.media_only_files === false
            ? this.t('workflow.modeAll')
            : this.t('workflow.modeMedia');
        },

        getCurrentStep(tab) {
          if (tab === 'copy') {
            if (this.running || this.total > 0 || this.log.length > 0) return 6;
            if (!this.settings.source_path) return 1;
            if (!this.copySourceSummary.exists) return 2;
            // Step 3 (configure) is always available; Save activates via hasChanges, no ring.
            if (!this.settings.destination_path) return 4;
            return 5;
          }

          if (tab === 'sort') {
            if (this.sortRunning || this.sortTotal > 0 || this.sortLog.length > 0) return 6;
            if (!this.settings.sort.source_path) return 1;
            if (!this.sortSourceSummary.exists) return 2;
            if (this.hasChanges) return 3;
            if (!this.settings.sort.destination_path || !this.settings.sort.duplicates_path || !this.settings.sort.unsortable_path) return 4;
            return 5;
          }

          if (tab === 'dedup') {
            if (this.dedupRunning || this.dedupTotal > 0 || this.dedupLog.length > 0) return 6;
            if (!this.settings.dedup.source_path) return 1;
            if (!this.dedupSourceSummary.exists) return 2;
            if (this.hasChanges) return 3;
            if (this.settings.dedup.action_mode === 'move_to_duplicates' && !this.settings.dedup.duplicates_path) return 4;
            return 5;
          }

          return 1;
        },

        canStartSort() {
          const s = this.settings.sort || {};
          return Boolean(
            (s.source_path || '').trim()
            && (s.destination_path || '').trim()
            && (s.duplicates_path || '').trim()
            && (s.unsortable_path || '').trim(),
          );
        },

        canStartDedup() {
          const s = this.settings.dedup || {};
          if (!(s.source_path || '').trim()) return false;
          if (s.action_mode === 'move_to_duplicates' && !(s.duplicates_path || '').trim()) return false;
          return true;
        },

        stepCardClass(tab, step) {
          const current = this.getCurrentStep(tab);
          // Run (5) and log (6) stay clickable; startSort/startDedup save settings first.
          if (step >= 5) {
            if (step === current) {
              return 'ring-2 ring-blue-500 rounded-xl p-3 bg-gray-900/40';
            }
            return 'rounded-xl p-3';
          }
          if (step === current) {
            return 'ring-2 ring-blue-500 rounded-xl p-3 bg-gray-900/40';
          }
          if (step > current) {
            return 'opacity-45 pointer-events-none rounded-xl p-3';
          }
          return 'rounded-xl p-3';
        },

        async init() {
          const [settingsRes, typesRes] = await Promise.all([
            fetch('/api/settings'),
            fetch('/api/file-types'),
          ]);
          const data = await settingsRes.json();
          const types = await typesRes.json();

          this.availableExtensions = types.extensions || [];
          this.settings = data;

          if (!this.settings.destination_smb) {
            this.settings.destination_smb = { enabled: false, server: '', share: '', username: '', mount_point: '' };
          }
          // SMB is temporarily disabled for MVP.
          this.settings.destination_smb.enabled = false;
          if (!this.settings.sort) {
            this.settings.sort = {
              source_path: '',
              destination_path: '',
              duplicates_path: '',
              unsortable_path: '',
              folder_structure: 'camera/year/month',
              selected_extensions: [],
              rename_mode: 'original',
              jpeg_to_jpg: false,
              extension_mode: 'lowercase',
              operation_mode: 'copy',
            };
          }
          if (!this.settings.dedup) {
            this.settings.dedup = {
              source_path: '',
              destination_path: '',
              duplicates_path: '',
              selected_extensions: [],
              match_mode: 'name',
              action_mode: 'delete',
              dry_run: false,
            };
          }
          if (!this.settings.preferences) {
            this.settings.preferences = {
              language: 'ru',
              theme: 'dark',
              media_only_files: true,
              default_paths: {
                copy_source: '',
                copy_destination: '',
                sort_source: '',
                sort_destination: '',
                sort_duplicates: '',
                sort_unsortable: '',
                dedup_source: '',
                dedup_destination: '',
                dedup_duplicates: '',
              },
            };
          }
          if (!['copy', 'move'].includes(this.settings.operation_mode)) {
            this.settings.operation_mode = 'copy';
          }
          if (!Array.isArray(this.settings.selected_extensions)) {
            this.settings.selected_extensions = [...this.availableExtensions];
          }
          if (!Array.isArray(this.settings.sort.selected_extensions)) {
            this.settings.sort.selected_extensions = [...this.availableExtensions];
          }
          if (!['original', 'lowercase', 'original_plus_number'].includes(this.settings.sort.rename_mode)) {
            this.settings.sort.rename_mode = 'original';
          }
          // Migrate legacy extension_mode "jpeg_to_jpg" → independent checkbox.
          if (this.settings.sort.extension_mode === 'jpeg_to_jpg') {
            this.settings.sort.jpeg_to_jpg = true;
            this.settings.sort.extension_mode = 'lowercase';
          }
          this.settings.sort.jpeg_to_jpg = !!this.settings.sort.jpeg_to_jpg;
          if (!['lowercase', 'uppercase'].includes(this.settings.sort.extension_mode)) {
            this.settings.sort.extension_mode = 'lowercase';
          }
          if (!['copy', 'move'].includes(this.settings.sort.operation_mode)) {
            this.settings.sort.operation_mode = 'copy';
          }
          if (!Array.isArray(this.settings.dedup.selected_extensions)) {
            this.settings.dedup.selected_extensions = [...this.availableExtensions];
          }
          if (!['name', 'name_date', 'name_size', 'hash'].includes(this.settings.dedup.match_mode)) {
            this.settings.dedup.match_mode = 'name';
          }
          if (!['delete', 'rename', 'move_to_duplicates'].includes(this.settings.dedup.action_mode)) {
            this.settings.dedup.action_mode = 'delete';
          }
          this.settings.dedup.dry_run = !!this.settings.dedup.dry_run;
          if (!['ru', 'en'].includes(this.settings.preferences.language)) {
            this.settings.preferences.language = 'ru';
          }
          if (!['dark', 'light'].includes(this.settings.preferences.theme)) {
            this.settings.preferences.theme = 'dark';
          }
          this.settings.preferences.media_only_files = this.settings.preferences.media_only_files !== false;
          if (!this.settings.preferences.default_paths) {
            this.settings.preferences.default_paths = {
              copy_source: '',
              copy_destination: '',
              sort_source: '',
              sort_destination: '',
              sort_duplicates: '',
              sort_unsortable: '',
              dedup_source: '',
              dedup_destination: '',
              dedup_duplicates: '',
            };
          }

          await this.refreshAvailableExtensions();
          await this.refreshSortExtensions();
          await this.refreshDedupExtensions();
          this.applyTheme();
          this.applyDefaultPathsIfEmpty();
          this.savedSettings = JSON.parse(JSON.stringify(this.settings));
          this.hasChanges = false;
        },

        onSettingsChange() {
          this.hasChanges = JSON.stringify(this.settings) !== JSON.stringify(this.savedSettings);
        },

        async saveSettings() {
          this.saving = true;
          try {
            const res = await fetch('/api/settings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.settings),
            });
            if (res.ok) {
              this.savedSettings = JSON.parse(JSON.stringify(this.settings));
              this.hasChanges = false;
              const okMsg = this.settings.preferences.language === 'en' ? '✓ Settings saved' : '✓ Настройки сохранены';
              this.addLog('info', okMsg);
              this.addSortLog('info', okMsg);
              this.addDedupLog('info', okMsg);
            } else {
              const errMsg = this.settings.preferences.language === 'en'
                ? `Save error: ${res.status}`
                : `Ошибка при сохранении: ${res.status}`;
              this.addLog('error', errMsg);
              this.addSortLog('error', errMsg);
              this.addDedupLog('error', errMsg);
            }
          } catch (e) {
            const errMsg = this.settings.preferences.language === 'en'
              ? `Error: ${e.message}`
              : `Ошибка: ${e.message}`;
            this.addLog('error', errMsg);
            this.addSortLog('error', errMsg);
            this.addDedupLog('error', errMsg);
          } finally {
            this.saving = false;
          }
        },

        async testSmb() {
          this.smbTesting = true;
          this.smbStatus = '';
          await this.saveSettings();
          const res = await fetch('/api/test-smb');
          const data = await res.json();
          this.smbTesting = false;
          if (data.status === 'ok') {
            this.smbStatusOk = true;
            this.smbStatus = this.settings.preferences.language === 'en'
              ? `Connected: ${data.mount_point}`
              : `Подключено: ${data.mount_point}`;
          } else if (data.status === 'disabled') {
            this.smbStatus = this.settings.preferences.language === 'en' ? 'SMB disabled' : 'SMB отключён';
            this.smbStatusOk = false;
          } else {
            this.smbStatusOk = false;
            this.smbStatus = this.settings.preferences.language === 'en'
              ? `Error: ${data.message}`
              : `Ошибка: ${data.message}`;
          }
        },

        applyTheme() {
          const theme = this.settings.preferences?.theme === 'light' ? 'theme-light' : 'theme-dark';
          document.body.classList.remove('theme-light', 'theme-dark');
          document.body.classList.add(theme);
        },

        applyDefaultPathsIfEmpty() {
          const d = this.settings.preferences?.default_paths || {};
          if (!this.settings.source_path && d.copy_source) this.settings.source_path = d.copy_source;
          if (!this.settings.destination_path && d.copy_destination) this.settings.destination_path = d.copy_destination;

          if (!this.settings.sort.source_path && d.sort_source) this.settings.sort.source_path = d.sort_source;
          if (!this.settings.sort.destination_path && d.sort_destination) this.settings.sort.destination_path = d.sort_destination;
          if (!this.settings.sort.duplicates_path && d.sort_duplicates) this.settings.sort.duplicates_path = d.sort_duplicates;
          if (!this.settings.sort.unsortable_path && d.sort_unsortable) this.settings.sort.unsortable_path = d.sort_unsortable;

          if (!this.settings.dedup.source_path && d.dedup_source) this.settings.dedup.source_path = d.dedup_source;
          if (!this.settings.dedup.destination_path && d.dedup_destination) this.settings.dedup.destination_path = d.dedup_destination;
          if (!this.settings.dedup.duplicates_path && d.dedup_duplicates) this.settings.dedup.duplicates_path = d.dedup_duplicates;
          this.onSettingsChange();
        },

        startCopy() {
          this.saveSettings().then(() => {
            this.running = true;
            this.total = 0;
            this.current = 0;
            this.copied = 0;
            this.skipped = 0;
            this.errors = 0;
            this.log = [];

            this.eventSource = new EventSource('/api/copy');

            this.eventSource.addEventListener('start', (e) => {
              const d = JSON.parse(e.data);
              this.total = d.total;
              this.addLog('info', this.settings.preferences.language === 'en' ? `Files found: ${d.total}` : `Найдено файлов: ${d.total}`);
            });

            this.eventSource.addEventListener('progress', (e) => {
              const d = JSON.parse(e.data);
              this.current = d.current;
              this.copied = d.copied;
              this.skipped = d.skipped;
              if (d.errors !== undefined) this.errors = d.errors ?? 0;

              if (d.status === 'copied') {
                const opMark = d.operation === 'move' ? '⇢' : '→';
                this.addLog('copied', `✓ ${d.file}  ${opMark}  ${d.dest}  [${d.camera}]`);
              } else if (d.status === 'skipped') {
                this.addLog('skipped', this.settings.preferences.language === 'en' ? `⊘ ${d.file}  (duplicate)` : `⊘ ${d.file}  (дубликат)`);
              } else if (d.status === 'error') {
                this.addLog('error', `✗ ${d.file}  — ${d.error}`);
              }
            });

            this.eventSource.addEventListener('info', (e) => {
              const d = JSON.parse(e.data);
              this.addLog('info', d.message);
            });

            this.eventSource.addEventListener('error', (e) => {
              try {
                const d = JSON.parse(e.data);
                this.addLog('error', this.settings.preferences.language === 'en' ? `Error: ${d.message}` : `Ошибка: ${d.message}`);
              } catch {
                this.addLog('error', this.settings.preferences.language === 'en' ? 'Connection interrupted' : 'Соединение прервано');
              }
              this.running = false;
              this.eventSource?.close();
            });

            this.eventSource.addEventListener('done', (e) => {
              const d = JSON.parse(e.data);
              this.addLog('done', this.settings.preferences.language === 'en'
                ? `━━ Done: copied ${d.copied}, skipped ${d.skipped}, errors ${d.errors} ━━`
                : `━━ Готово: скопировано ${d.copied}, пропущено ${d.skipped}, ошибок ${d.errors} ━━`);
              this.running = false;
              this.eventSource?.close();
            });
          });
        },

        stopCopy() {
          this.eventSource?.close();
          this.running = false;
          this.addLog('info', this.settings.preferences.language === 'en' ? '— Stopped by user —' : '— Остановлено пользователем —');
        },

        startSort() {
          if (this.settings.sort.operation_mode === 'move') {
            const ok = window.confirm(this.settings.preferences.language === 'en'
              ? 'Move mode removes files from source after processing.\n\nContinue?'
              : 'Режим "Переместить" удалит файлы из исходной папки после обработки.\n\nПродолжить?');
            if (!ok) return;
          }

          this.saveSettings().then(() => {
            this.sortRunning = true;
            this.sortTotal = 0;
            this.sortCurrent = 0;
            this.sortSorted = 0;
            this.sortDuplicates = 0;
            this.sortUnsortable = 0;
            this.sortErrors = 0;
            this.sortLog = [];

            this.sortEventSource = new EventSource('/api/sort');

            this.sortEventSource.addEventListener('start', (e) => {
              const d = JSON.parse(e.data);
              this.sortTotal = d.total;
              this.addSortLog('info', this.settings.preferences.language === 'en' ? `Files found: ${d.total}` : `Найдено файлов: ${d.total}`);
            });

            this.sortEventSource.addEventListener('progress', (e) => {
              const d = JSON.parse(e.data);
              this.sortCurrent = d.current;
              this.sortSorted = d.sorted ?? this.sortSorted;
              this.sortDuplicates = d.duplicates ?? this.sortDuplicates;
              this.sortUnsortable = d.unsortable ?? this.sortUnsortable;
              this.sortErrors = d.errors ?? this.sortErrors;

              if (d.status === 'sorted') {
                const opMark = d.operation === 'move' ? '⇢' : '→';
                this.addSortLog('sorted', `✓ ${d.file}  ${opMark}  ${d.dest}`);
              } else if (d.status === 'duplicate') {
                const opMark = d.operation === 'move' ? '⇢' : '→';
                this.addSortLog('duplicate', this.settings.preferences.language === 'en'
                  ? `⊘ ${d.file}  ${opMark}  duplicates: ${d.dest}`
                  : `⊘ ${d.file}  ${opMark}  дубликаты: ${d.dest}`);
              } else if (d.status === 'unsortable') {
                const opMark = d.operation === 'move' ? '⇢' : '→';
                this.addSortLog('unsortable', this.settings.preferences.language === 'en'
                  ? `? ${d.file}  ${opMark}  unsortable: ${d.dest}`
                  : `? ${d.file}  ${opMark}  несортируемое: ${d.dest}`);
              } else if (d.status === 'error') {
                this.addSortLog('error', `✗ ${d.file}  — ${d.error}`);
              }
            });

            this.sortEventSource.addEventListener('error', (e) => {
              try {
                const d = JSON.parse(e.data);
                this.addSortLog('error', this.settings.preferences.language === 'en' ? `Error: ${d.message}` : `Ошибка: ${d.message}`);
              } catch {
                this.addSortLog('error', this.settings.preferences.language === 'en' ? 'Connection interrupted' : 'Соединение прервано');
              }
              this.sortRunning = false;
              this.sortEventSource?.close();
            });

            this.sortEventSource.addEventListener('done', (e) => {
              const d = JSON.parse(e.data);
              this.addSortLog('done', this.settings.preferences.language === 'en'
                ? `━━ Done: sorted ${d.sorted}, duplicates ${d.duplicates}, unsortable ${d.unsortable}, errors ${d.errors} ━━`
                : `━━ Готово: отсортировано ${d.sorted}, дубликатов ${d.duplicates}, несортируемых ${d.unsortable}, ошибок ${d.errors} ━━`);
              this.sortRunning = false;
              this.sortEventSource?.close();
            });
          });
        },

        stopSort() {
          this.sortEventSource?.close();
          this.sortRunning = false;
          this.addSortLog('info', this.settings.preferences.language === 'en' ? '— Sorting stopped by user —' : '— Сортировка остановлена пользователем —');
        },

        startDedup() {
          if (this.settings.dedup.action_mode === 'delete' && !this.settings.dedup.dry_run) {
            const ok = window.confirm(this.settings.preferences.language === 'en'
              ? 'Delete mode permanently removes files.\n\nContinue?'
              : 'Режим "Удалять дубликаты" безвозвратно удалит файлы.\n\nПродолжить?');
            if (!ok) return;
          }
          if (this.settings.dedup.action_mode === 'move_to_duplicates' && !this.settings.dedup.duplicates_path) {
            this.addDedupLog('error', this.settings.preferences.language === 'en'
              ? 'Set duplicates folder for move mode.'
              : 'Укажите папку дубликатов для режима перемещения.');
            return;
          }

          this.saveSettings().then(() => {
            this.dedupRunning = true;
            this.dedupTotal = 0;
            this.dedupCurrent = 0;
            this.dedupFound = 0;
            this.dedupProcessed = 0;
            this.dedupErrors = 0;
            this.dedupLog = [];

            this.dedupEventSource = new EventSource('/api/deduplicate');

            this.dedupEventSource.addEventListener('start', (e) => {
              const d = JSON.parse(e.data);
              const mode = this.settings.dedup.dry_run ? ' [PREVIEW]' : '';
              this.addDedupLog('info', this.settings.preferences.language === 'en'
                ? `Scanning${mode}: ${d.total} files (${d.working_path})`
                : `Сканирование${mode}: ${d.total} файлов (${d.working_path})`);
            });

            this.dedupEventSource.addEventListener('scan', () => {
              // прогресс сканирования отображаем в логе, не в итоговом баре обработки
            });

            this.dedupEventSource.addEventListener('progress', (e) => {
              const d = JSON.parse(e.data);
              this.dedupCurrent = d.current ?? this.dedupCurrent;
              this.dedupTotal = d.total ?? this.dedupTotal;
              this.dedupFound = d.duplicates ?? this.dedupFound;
              this.dedupProcessed = d.processed ?? this.dedupProcessed;
              this.dedupErrors = d.errors ?? this.dedupErrors;

              if (d.status === 'deleted') {
                this.addDedupLog('processed', this.settings.preferences.language === 'en'
                  ? `${d.dry_run ? '•' : '✓'} deleted: ${d.file}`
                  : `${d.dry_run ? '•' : '✓'} удалён: ${d.file}`);
              } else if (d.status === 'renamed') {
                this.addDedupLog('processed', this.settings.preferences.language === 'en'
                  ? `${d.dry_run ? '•' : '✓'} renamed: ${d.file} -> ${d.dest}`
                  : `${d.dry_run ? '•' : '✓'} переименован: ${d.file} -> ${d.dest}`);
              } else if (d.status === 'moved') {
                this.addDedupLog('processed', this.settings.preferences.language === 'en'
                  ? `${d.dry_run ? '•' : '✓'} moved: ${d.file} -> ${d.dest}`
                  : `${d.dry_run ? '•' : '✓'} перемещён: ${d.file} -> ${d.dest}`);
              } else if (d.status === 'error') {
                this.addDedupLog('error', `✗ ${d.file} — ${d.error}`);
              }
            });

            this.dedupEventSource.addEventListener('error', (e) => {
              try {
                const d = JSON.parse(e.data);
                this.addDedupLog('error', this.settings.preferences.language === 'en' ? `Error: ${d.message}` : `Ошибка: ${d.message}`);
              } catch {
                this.addDedupLog('error', this.settings.preferences.language === 'en' ? 'Connection interrupted' : 'Соединение прервано');
              }
              this.dedupRunning = false;
              this.dedupEventSource?.close();
            });

            this.dedupEventSource.addEventListener('done', (e) => {
              const d = JSON.parse(e.data);
              this.dedupFound = d.duplicates ?? this.dedupFound;
              this.dedupProcessed = d.processed ?? this.dedupProcessed;
              this.dedupErrors = d.errors ?? this.dedupErrors;
              this.dedupTotal = this.dedupFound;
              this.dedupCurrent = this.dedupProcessed;
              this.addDedupLog('done', this.settings.preferences.language === 'en'
                ? `━━ ${d.dry_run ? 'Preview complete' : 'Done'}: duplicates ${d.duplicates}, processed ${d.processed}, errors ${d.errors} ━━`
                : `━━ ${d.dry_run ? 'Превью завершено' : 'Готово'}: дубликатов ${d.duplicates}, обработано ${d.processed}, ошибок ${d.errors} ━━`);
              this.dedupRunning = false;
              this.dedupEventSource?.close();
            });
          });
        },

        stopDedup() {
          this.dedupEventSource?.close();
          this.dedupRunning = false;
          this.addDedupLog('info', this.settings.preferences.language === 'en' ? '— Deduplication stopped by user —' : '— Дедупликация остановлена пользователем —');
        },

        toggleExtension(ext) {
          if (this.settings.selected_extensions.includes(ext)) {
            this.settings.selected_extensions = this.settings.selected_extensions.filter((e) => e !== ext);
          } else {
            this.settings.selected_extensions = [...this.settings.selected_extensions, ext];
          }
          this.onSettingsChange();
        },

        selectAllExtensions() {
          this.settings.selected_extensions = [...this.availableExtensions];
          this.onSettingsChange();
        },

        clearExtensions() {
          this.settings.selected_extensions = [];
          this.onSettingsChange();
        },

        toggleSortExtension(ext) {
          if (this.settings.sort.selected_extensions.includes(ext)) {
            this.settings.sort.selected_extensions = this.settings.sort.selected_extensions.filter((e) => e !== ext);
          } else {
            this.settings.sort.selected_extensions = [...this.settings.sort.selected_extensions, ext];
          }
          this.onSettingsChange();
        },

        selectAllSortExtensions() {
          this.settings.sort.selected_extensions = [...this.sortAvailableExtensions];
          this.onSettingsChange();
        },

        clearSortExtensions() {
          this.settings.sort.selected_extensions = [];
          this.onSettingsChange();
        },

        toggleDedupExtension(ext) {
          if (this.settings.dedup.selected_extensions.includes(ext)) {
            this.settings.dedup.selected_extensions = this.settings.dedup.selected_extensions.filter((e) => e !== ext);
          } else {
            this.settings.dedup.selected_extensions = [...this.settings.dedup.selected_extensions, ext];
          }
          this.onSettingsChange();
        },

        selectAllDedupExtensions() {
          this.settings.dedup.selected_extensions = [...this.dedupAvailableExtensions];
          this.onSettingsChange();
        },

        clearDedupExtensions() {
          this.settings.dedup.selected_extensions = [];
          this.onSettingsChange();
        },

        async refreshAvailableExtensions() {
          const source = (this.settings.source_path || '').trim();
          const mediaOnly = this.settings.preferences?.media_only_files !== false;
          if (!source) {
            this.availableExtensions = [];
            this.settings.selected_extensions = [];
            this.copySourceSummary = { exists: false, total_files: 0, matched_files: 0 };
            this.onSettingsChange();
            return;
          }

          try {
            const res = await fetch(`/api/source-summary?path=${encodeURIComponent(source)}&media_only=${mediaOnly ? 'true' : 'false'}`);
            if (!res.ok) return;
            const summary = await res.json();
            this.copySourceSummary = {
              exists: !!summary.exists,
              total_files: summary.total_files || 0,
              matched_files: summary.matched_files || 0,
            };
            this.availableExtensions = Array.isArray(summary.extensions) ? summary.extensions : [];
          } catch {
            return;
          } finally {
            this.settings.selected_extensions = this.settings.selected_extensions
              .map((ext) => String(ext).toLowerCase())
              .filter((ext) => this.availableExtensions.includes(ext));
            if (this.availableExtensions.length > 0 && this.settings.selected_extensions.length === 0) {
              this.settings.selected_extensions = [...this.availableExtensions];
            }
            this.onSettingsChange();
          }
        },

        async refreshSortExtensions() {
          const source = (this.settings.sort.source_path || '').trim();
          const mediaOnly = this.settings.preferences?.media_only_files !== false;
          if (!source) {
            this.sortAvailableExtensions = [];
            this.settings.sort.selected_extensions = [];
            this.sortSourceSummary = { exists: false, total_files: 0, matched_files: 0 };
            this.onSettingsChange();
            return;
          }

          try {
            const res = await fetch(`/api/source-summary?path=${encodeURIComponent(source)}&media_only=${mediaOnly ? 'true' : 'false'}`);
            if (!res.ok) return;
            const summary = await res.json();
            this.sortSourceSummary = {
              exists: !!summary.exists,
              total_files: summary.total_files || 0,
              matched_files: summary.matched_files || 0,
            };
            this.sortAvailableExtensions = Array.isArray(summary.extensions) ? summary.extensions : [];
          } catch {
            return;
          } finally {
            this.settings.sort.selected_extensions = this.settings.sort.selected_extensions
              .map((ext) => String(ext).toLowerCase())
              .filter((ext) => this.sortAvailableExtensions.includes(ext));
            if (this.sortAvailableExtensions.length > 0 && this.settings.sort.selected_extensions.length === 0) {
              this.settings.sort.selected_extensions = [...this.sortAvailableExtensions];
            }
            this.onSettingsChange();
          }
        },

        async refreshDedupExtensions() {
          const source = (this.settings.dedup.source_path || '').trim();
          const mediaOnly = this.settings.preferences?.media_only_files !== false;
          if (!source) {
            this.dedupAvailableExtensions = [];
            this.settings.dedup.selected_extensions = [];
            this.dedupSourceSummary = { exists: false, total_files: 0, matched_files: 0 };
            this.onSettingsChange();
            return;
          }

          try {
            const res = await fetch(`/api/source-summary?path=${encodeURIComponent(source)}&media_only=${mediaOnly ? 'true' : 'false'}`);
            if (!res.ok) return;
            const summary = await res.json();
            this.dedupSourceSummary = {
              exists: !!summary.exists,
              total_files: summary.total_files || 0,
              matched_files: summary.matched_files || 0,
            };
            this.dedupAvailableExtensions = Array.isArray(summary.extensions) ? summary.extensions : [];
          } catch {
            return;
          } finally {
            this.settings.dedup.selected_extensions = this.settings.dedup.selected_extensions
              .map((ext) => String(ext).toLowerCase())
              .filter((ext) => this.dedupAvailableExtensions.includes(ext));
            if (this.dedupAvailableExtensions.length > 0 && this.settings.dedup.selected_extensions.length === 0) {
              this.settings.dedup.selected_extensions = [...this.dedupAvailableExtensions];
            }
            this.onSettingsChange();
          }
        },

        addLog(type, msg) {
          this.log.push({ type, msg });
          this.$nextTick(() => {
            const el = document.getElementById('log-container');
            if (el) el.scrollTop = el.scrollHeight;
          });
        },

        addSortLog(type, msg) {
          this.sortLog.push({ type, msg });
          this.$nextTick(() => {
            const el = document.getElementById('sort-log-container');
            if (el) el.scrollTop = el.scrollHeight;
          });
        },

        addDedupLog(type, msg) {
          this.dedupLog.push({ type, msg });
          this.$nextTick(() => {
            const el = document.getElementById('dedup-log-container');
            if (el) el.scrollTop = el.scrollHeight;
          });
        },


        formatApiError(data, status) {
          const detail = data?.detail;
          if (typeof detail === 'string') return detail;
          if (Array.isArray(detail)) {
            return detail.map((item) => item.msg || JSON.stringify(item)).join('; ');
          }
          return `${status}`;
        },

        metaHasChanges() {
          if (!this.meta.loaded || !this.meta.snapshot) return false;
          if (!this.meta.exifWritable) {
            return JSON.stringify(this.meta.times) !== JSON.stringify(this.meta.snapshot.times);
          }
          return JSON.stringify({ exif: this.meta.exif, times: this.meta.times }) !== JSON.stringify(this.meta.snapshot);
        },

        resetMetaEdits() {
          if (!this.meta.snapshot) return;
          const snap = JSON.parse(JSON.stringify(this.meta.snapshot));
          this.meta.exif = { ...this.meta.exif, ...snap.exif };
          this.meta.times = { ...this.meta.times, ...snap.times };
        },

        applyMetaPayload(data) {
          this.meta.exiftoolAvailable = data.exiftool_available !== false;
          this.meta.exifWritable = data.exif_writable !== false;
          this.meta.exifBlockReason = data.exif_block_reason || '';
          this.meta.exif = { ...this.meta.exif, ...(data.exif || {}) };
          this.meta.times = { ...this.meta.times, ...(data.times || {}) };
          this.meta.snapshot = JSON.parse(JSON.stringify({ exif: this.meta.exif, times: this.meta.times }));
          this.meta.loaded = true;
        },

        async loadMetaFile() {
          const filePath = (this.meta.filePath || '').trim();
          this.meta.message = '';
          this.meta.error = '';
          if (!filePath) {
            this.meta.loaded = false;
            this.meta.snapshot = null;
            return;
          }
          this.meta.loading = true;
          try {
            const res = await fetch(`/api/file-metadata?path=${encodeURIComponent(filePath)}`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              this.meta.loaded = false;
              this.meta.snapshot = null;
              this.meta.error = this.formatApiError(data, res.status);
              return;
            }
            this.applyMetaPayload(data);
          } catch (e) {
            this.meta.loaded = false;
            this.meta.snapshot = null;
            this.meta.error = e.message || String(e);
          } finally {
            this.meta.loading = false;
          }
        },

        async saveMetaFile() {
          const filePath = (this.meta.filePath || '').trim();
          if (!filePath || !this.meta.loaded) return;
          this.meta.saving = true;
          this.meta.message = '';
          this.meta.error = '';
          try {
            const res = await fetch('/api/file-metadata', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: filePath, exif: this.meta.exif, times: this.meta.times }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              this.meta.error = this.formatApiError(data, res.status);
              return;
            }
            if (data.metadata) this.applyMetaPayload(data.metadata);
            const warn = Array.isArray(data.warnings) ? data.warnings.join(' ') : '';
            this.meta.message = (this.settings.preferences.language === 'en' ? 'Saved' : 'Сохранено') + (warn ? ` — ${warn}` : '');
          } catch (e) {
            this.meta.error = e.message || String(e);
          } finally {
            this.meta.saving = false;
          }
        },

        async openMetaFileBrowser() {
          this.browser.target = 'meta_file';
          this.browser.pick = 'file';
          this.browser.selectedFile = '';
          this.browser.open = true;
          await this.browseTo('');
        },

        browserCanSelect() {
          if (this.browser.pick === 'file') {
            return !!this.browser.selectedFile;
          }
          return !!this.browser.current;
        },

        async browseEntry(entry) {
          if (entry.type === 'file') {
            this.browser.selectedFile = entry.path;
            this.browser.current = entry.path;
            return;
          }
          await this.browseTo(entry.path);
        },

        // ── File browser ──
        async openBrowser(target) {
          this.browser.target = target;
          this.browser.pick = 'folder';
          this.browser.selectedFile = '';
          this.browser.open = true;
          await this.browseTo('');
        },

        async browseTo(path) {
          const pick = this.browser.pick || 'folder';
          let url = pick === 'file' ? '/api/browse?pick=file' : '/api/browse';
          if (path) url += `${url.includes('?') ? '&' : '?'}path=${encodeURIComponent(path)}`;
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();
          this.browser.current = data.path || '';
          this.browser.parent = data.parent || '';
          this.browser.entries = data.entries || [];
          if (pick === 'file') this.browser.selectedFile = '';
        },

        selectBrowserPath() {
          if (this.browser.target === 'source') {
            this.settings.source_path = this.browser.current;
            this.refreshAvailableExtensions();
          } else if (this.browser.target === 'destination') {
            this.settings.destination_path = this.browser.current;
          } else if (this.browser.target === 'sort_source') {
            this.settings.sort.source_path = this.browser.current;
            this.refreshSortExtensions();
          } else if (this.browser.target === 'sort_destination') {
            this.settings.sort.destination_path = this.browser.current;
          } else if (this.browser.target === 'sort_duplicates') {
            this.settings.sort.duplicates_path = this.browser.current;
          } else if (this.browser.target === 'sort_unsortable') {
            this.settings.sort.unsortable_path = this.browser.current;
          } else if (this.browser.target === 'dedup_source') {
            this.settings.dedup.source_path = this.browser.current;
            this.refreshDedupExtensions();
          } else if (this.browser.target === 'dedup_destination') {
            this.settings.dedup.destination_path = this.browser.current;
          } else if (this.browser.target === 'dedup_duplicates') {
            this.settings.dedup.duplicates_path = this.browser.current;
          } else if (this.browser.target === 'meta_file') {
            this.meta.filePath = this.browser.selectedFile || this.browser.current;
            this.loadMetaFile();
          }
          this.browser.pick = 'folder';
          this.browser.selectedFile = '';
          this.onSettingsChange();
          this.browser.open = false;
        },
      };
    }
  </script>
</body>
